<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>라이프 캘린더</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // 0. Firebase 설정
    // ==========================================
    const FIREBASE_CONFIG = {
      databaseURL: "https://calander-b4df0-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    let db = null;
    const isFirebaseConfigured =
      FIREBASE_CONFIG.databaseURL &&
      FIREBASE_CONFIG.databaseURL.startsWith("https://");

    if (isFirebaseConfigured && window.firebase) {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        db = firebase.database();
      } catch (e) {
        console.error("Firebase 초기화 오류:", e);
      }
    }

    // ==========================================
    // 1. 기본 프리셋 설정
    // ==========================================
    const DEFAULT_CONFIG = {
      appTitle: '라이프 캘린더',
      workoutTags: [
        '더클라임 사당', '더클라임 구로', '더클라임 연남', '더클라임 강남',
        '홈트/방음부스', '야외 러닝', 'Giant SCR 자출',
        '오버행', '슬랩', '토훅', '다이나믹/포고', '고관절 가동성'
      ],
      workoutMetrics: [
        { id: 'm_navy', label: '남색 완등', unit: '문제' },
        { id: 'm_purple', label: '보라 완등', unit: '문제' },
        { id: 'm_pink', label: '핑크 완등', unit: '문제' },
        { id: 'm_pullup', label: '중량 풀업 최고무게', unit: 'kg' },
        { id: 'm_run', label: 'Zone 2 러닝 거리', unit: 'km' }
      ],
      workoutChecklists: [
        '비스트메이커 1000 (14/18/25mm 인터벌)',
        '왼손 11kg 핀치 등척성 홀드',
        '턱 플란체 & 플란체 린',
        '슈도 푸쉬업 (10회 세트)',
        'WTYT 어깨 안정화 & 전거근 프로트랙션',
        '코호흡 Zone 2 러닝 (5\'58"~6\'15" 페이스)'
      ],
      habits: [
        { id: 'h_vocal', icon: '🎤', label: '방음부스 보컬 연습 (복압/목열기/텅트릴/믹스)' },
        { id: 'h_jp', icon: '🇯🇵', label: '일본어 공부 (JLPT N2 문법/한자/가사)' },
        { id: 'h_foam', icon: '🧘', label: 'EPP 폼롤러 광배근/어깨 근막이완' },
        { id: 'h_read', icon: '📚', label: '독서 / 밀리의서재 / 웹툰·라노벨' },
        { id: 'h_vocal_app', icon: '💻', label: '보컬 노트 스튜디오 곡/가사 마크업 정리' }
      ],
      conditionSymptoms: [
        '감기/몸살 기운', '인후통/목 잠김', '수면 부족/피로', '두통', '소화불량', '근육통 심함'
      ],
      bodyParts: [
        '손가락 A2 풀리/관절', '왼쪽 팔꿈치/전완근', '오른쪽 팔꿈치/전완근',
        '어깨/회전근개', '허리/코어', '무릎/발목'
      ],
      expenseCategories: [
        '식비/카페', '클라이밍/운동', '음악/장비/악보', '아반떼 CN7/교통', '구독/게임', '생활/기타'
      ],
      paymentMethods: [
        '카드 일시불', '카드 할부(실적제외)', '체크/계좌이체'
      ],
      shiftTypes: [
        { id: 'st_day', label: '주간', defaultStart: '09:00', defaultEnd: '18:00', badgeColor: 'emerald' },
        { id: 'st_ot', label: '연장/특근', defaultStart: '09:00', defaultEnd: '21:00', badgeColor: 'amber' },
        { id: 'st_night', label: '야간', defaultStart: '21:00', defaultEnd: '06:00', badgeColor: 'indigo' },
        { id: 'st_off', label: '휴무', defaultStart: '', defaultEnd: '', badgeColor: 'slate' }
      ]
    };

    const STORAGE_CONFIG_KEY = 'LIFE_CALENDAR_CUSTOM_CONFIG_V2';
    const STORAGE_LOGS_KEY = 'LIFE_CALENDAR_DAILY_LOGS_V2';
    const STORAGE_GOALS_KEY = 'LIFE_CALENDAR_GOALS_V1';
    const STORAGE_SHIFTS_KEY = 'LIFE_CALENDAR_SHIFTS_V1';
    const DB_ROOT_PATH = 'lifeCalendar';

    const formatDateKey = (dateObj) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const getWeekKey = (dateKey) => {
      const base = new Date(dateKey + 'T00:00:00');
      const sunday = new Date(base);
      sunday.setDate(base.getDate() - base.getDay());
      return formatDateKey(sunday);
    };

    const getMonthKey = (dateKey) => dateKey.slice(0, 7);

    const getEmptyDayLog = () => ({
      workoutTags: [],
      workoutMetrics: {},
      workoutChecks: [],
      workoutMemo: '',
      habitsDone: [],
      isSick: false,
      symptoms: [],
      painLevels: {},
      conditionMemo: '',
      expenses: [],
      dailyNote: '',
      diaryTitle: '',
      diaryBody: '',
      photos: [],
      videos: []
    });

    const getEmptyShift = (shiftTypeObj) => ({
      typeId: shiftTypeObj?.id || 'st_day',
      label: shiftTypeObj?.label || '주간',
      startTime: shiftTypeObj?.defaultStart || '09:00',
      endTime: shiftTypeObj?.defaultEnd || '18:00',
      overtimeHours: 0,
      note: ''
    });

    const calcShiftHours = (startTime, endTime) => {
      if (!startTime || !endTime) return 0;
      const [sh, sm] = startTime.split(':').map(Number);
      const [eh, em] = endTime.split(':').map(Number);
      if ([sh, sm, eh, em].some(Number.isNaN)) return 0;
      let startMin = sh * 60 + sm;
      let endMin = eh * 60 + em;
      if (endMin < startMin) endMin += 24 * 60;
      return Math.max(0, Number(((endMin - startMin) / 60).toFixed(1)));
    };

    const compressImageFile = (file, maxWidth = 1080, quality = 0.72) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

    const parseVideoEmbedUrl = (rawUrl) => {
      const url = (rawUrl || '').trim();
      if (!url) return null;

      const ytMatch = url.match(
        /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/
      );
      if (ytMatch && ytMatch[1]) {
        return {
          platform: 'YouTube',
          embedUrl: `https://www.youtube.com/embed/${ytMatch[1]}`,
          originalUrl: url
        };
      }

      const driveFileMatch = url.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
      if (driveFileMatch && driveFileMatch[1]) {
        return {
          platform: 'Google Drive',
          embedUrl: `https://drive.google.com/file/d/${driveFileMatch[1]}/preview`,
          originalUrl: url
        };
      }
      const driveQueryMatch = url.match(/drive\.google\.com\/.*[?&]id=([A-Za-z0-9_-]+)/);
      if (driveQueryMatch && driveQueryMatch[1]) {
        return {
          platform: 'Google Drive',
          embedUrl: `https://drive.google.com/file/d/${driveQueryMatch[1]}/preview`,
          originalUrl: url
        };
      }

      return null;
    };

    function App() {
      const [syncStatus, setSyncStatus] = useState(db ? 'connecting' : 'local');

      // 최상위 앱 섹션 ('calendar' | 'shift') - 캘린더와 근무표 완전 분리
      const [mainSection, setMainSection] = useState('calendar');

      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_CONFIG_KEY);
          return saved ? { ...DEFAULT_CONFIG, ...JSON.parse(saved) } : DEFAULT_CONFIG;
        } catch (e) {
          return DEFAULT_CONFIG;
        }
      });

      const [logs, setLogs] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_LOGS_KEY);
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      const [goals, setGoals] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_GOALS_KEY);
          return saved ? JSON.parse(saved) : { daily: {}, weekly: {}, monthly: {} };
        } catch (e) {
          return { daily: {}, weekly: {}, monthly: {} };
        }
      });

      // 근무표 데이터: { 'YYYY-MM-DD': { typeId, label, startTime, endTime, overtimeHours, note } }
      const [shifts, setShifts] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_SHIFTS_KEY);
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      // Firebase 실시간 리스너
      useEffect(() => {
        if (!db) return;

        const configRef = db.ref(`${DB_ROOT_PATH}/config`);
        const logsRef = db.ref(`${DB_ROOT_PATH}/logs`);
        const goalsRef = db.ref(`${DB_ROOT_PATH}/goals`);
        const shiftsRef = db.ref(`${DB_ROOT_PATH}/shifts`);

        const onConfigValue = (snapshot) => {
          const val = snapshot.val();
          if (val) {
            const merged = { ...DEFAULT_CONFIG, ...val };
            setConfig(merged);
            localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(merged));
          } else {
            configRef.set(config);
          }
          setSyncStatus('synced');
        };

        const onLogsValue = (snapshot) => {
          const val = snapshot.val();
          if (val) {
            setLogs(val);
            localStorage.setItem(STORAGE_LOGS_KEY, JSON.stringify(val));
          } else if (Object.keys(logs).length > 0) {
            logsRef.set(logs);
          }
          setSyncStatus('synced');
        };

        const onGoalsValue = (snapshot) => {
          const val = snapshot.val();
          if (val) {
            const normalized = {
              daily: val.daily || {},
              weekly: val.weekly || {},
              monthly: val.monthly || {}
            };
            setGoals(normalized);
            localStorage.setItem(STORAGE_GOALS_KEY, JSON.stringify(normalized));
          }
          setSyncStatus('synced');
        };

        const onShiftsValue = (snapshot) => {
          const val = snapshot.val();
          if (val) {
            setShifts(val);
            localStorage.setItem(STORAGE_SHIFTS_KEY, JSON.stringify(val));
          }
          setSyncStatus('synced');
        };

        configRef.on('value', onConfigValue, () => setSyncStatus('error'));
        logsRef.on('value', onLogsValue, () => setSyncStatus('error'));
        goalsRef.on('value', onGoalsValue, () => setSyncStatus('error'));
        shiftsRef.on('value', onShiftsValue, () => setSyncStatus('error'));

        return () => {
          configRef.off('value', onConfigValue);
          logsRef.off('value', onLogsValue);
          goalsRef.off('value', onGoalsValue);
          shiftsRef.off('value', onShiftsValue);
        };
      }, []);

      const saveConfig = (newConfig) => {
        setConfig(newConfig);
        localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(newConfig));
        if (db) {
          setSyncStatus('saving');
          db.ref(`${DB_ROOT_PATH}/config`)
            .set(newConfig)
            .then(() => setSyncStatus('synced'))
            .catch(() => setSyncStatus('error'));
        }
      };

      const updateDayLog = (updater, targetDateKey = null) => {
        const keyToUse = targetDateKey || selectedDateKey;
        setLogs((prev) => {
          const existing = { ...getEmptyDayLog(), ...(prev[keyToUse] || {}) };
          const updated = typeof updater === 'function' ? updater(existing) : { ...existing, ...updater };
          const nextLogs = { ...prev, [keyToUse]: updated };
          localStorage.setItem(STORAGE_LOGS_KEY, JSON.stringify(nextLogs));

          if (db) {
            setSyncStatus('saving');
            db.ref(`${DB_ROOT_PATH}/logs/${keyToUse}`)
              .set(updated)
              .then(() => setSyncStatus('synced'))
              .catch(() => setSyncStatus('error'));
          }
          return nextLogs;
        });
      };

      const saveShiftForDate = (dateKey, shiftData) => {
        setShifts((prev) => {
          const nextShifts = { ...prev };
          if (!shiftData) {
            delete nextShifts[dateKey];
          } else {
            nextShifts[dateKey] = shiftData;
          }
          localStorage.setItem(STORAGE_SHIFTS_KEY, JSON.stringify(nextShifts));

          if (db) {
            setSyncStatus('saving');
            db.ref(`${DB_ROOT_PATH}/shifts/${dateKey}`)
              .set(shiftData || null)
              .then(() => setSyncStatus('synced'))
              .catch(() => setSyncStatus('error'));
          }
          return nextShifts;
        });
      };

      // 캘린더 및 화면 상태
      const [viewMode, setViewMode] = useState('month');
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDateKey, setSelectedDateKey] = useState(formatDateKey(new Date()));
      const [activeTab, setActiveTab] = useState('workout');
      const [isEditConfigMode, setIsEditConfigMode] = useState(false);
      const [isEditingTitle, setIsEditingTitle] = useState(false);

      // 근무표 탭 상태
      const [shiftViewMode, setShiftViewMode] = useState('week'); // 'week' | 'month'
      const [newShiftTypeLabel, setNewShiftTypeLabel] = useState('');
      const [newShiftStart, setNewShiftStart] = useState('09:00');
      const [newShiftEnd, setNewShiftEnd] = useState('18:00');

      // 더블클릭/상세 일기 모달 상태
      const [diaryModalDateKey, setDiaryModalDateKey] = useState(null);
      const [lightboxPhoto, setLightboxPhoto] = useState(null);
      const [videoTitleInput, setVideoTitleInput] = useState('');
      const [videoUrlInput, setVideoUrlInput] = useState('');
      const [videoErrorMsg, setVideoErrorMsg] = useState('');
      const [isCompressingPhoto, setIsCompressingPhoto] = useState(false);

      // 검색 모달 상태
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [searchFilter, setSearchFilter] = useState('all');

      // 일 / 주 / 월 목표 보드 상태
      const [goalPeriod, setGoalPeriod] = useState('daily');
      const [goalInput, setGoalInput] = useState('');
      const [editingGoalId, setEditingGoalId] = useState(null);
      const [editingGoalText, setEditingGoalText] = useState('');

      // 새 항목 추가용 입력 상태
      const [newTagInput, setNewTagInput] = useState('');
      const [newMetricLabel, setNewMetricLabel] = useState('');
      const [newMetricUnit, setNewMetricUnit] = useState('회');
      const [newCheckInput, setNewCheckInput] = useState('');
      const [newHabitIcon, setNewHabitIcon] = useState('🔥');
      const [newHabitLabel, setNewHabitLabel] = useState('');
      const [newSymptomInput, setNewSymptomInput] = useState('');
      const [newBodyPartInput, setNewBodyPartInput] = useState('');
      const [newCategoryInput, setNewCategoryInput] = useState('');
      const [newPaymentInput, setNewPaymentInput] = useState('');

      // 가계부 지출 입력 상태
      const [expCategory, setExpCategory] = useState(config.expenseCategories[0] || '식비/카페');
      const [expPayment, setExpPayment] = useState(config.paymentMethods[0] || '카드 일시불');
      const [expTitle, setExpTitle] = useState('');
      const [expAmount, setExpAmount] = useState('');
      const [editingExpenseId, setEditingExpenseId] = useState(null);

      const currentDayLog = useMemo(() => {
        return { ...getEmptyDayLog(), ...(logs[selectedDateKey] || {}) };
      }, [logs, selectedDateKey]);

      const activeDiaryLog = useMemo(() => {
        if (!diaryModalDateKey) return getEmptyDayLog();
        return { ...getEmptyDayLog(), ...(logs[diaryModalDateKey] || {}) };
      }, [logs, diaryModalDateKey]);

      const currentShift = shifts[selectedDateKey] || null;

      const openDiaryForDate = (dateKey) => {
        setSelectedDateKey(dateKey);
        setDiaryModalDateKey(dateKey);
        setVideoErrorMsg('');
      };

      const handlePhotoUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length || !diaryModalDateKey) return;
        setIsCompressingPhoto(true);
        try {
          const compressedItems = [];
          for (const file of files) {
            const dataUrl = await compressImageFile(file, 1080, 0.72);
            compressedItems.push({
              id: 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
              dataUrl,
              caption: file.name.replace(/\.[^/.]+$/, '')
            });
          }
          updateDayLog(
            (prev) => ({
              ...prev,
              photos: [...(prev.photos || []), ...compressedItems]
            }),
            diaryModalDateKey
          );
        } catch (err) {
          alert('사진 처리 중 오류가 발생했습니다.');
        } finally {
          setIsCompressingPhoto(false);
          e.target.value = '';
        }
      };

      const handleDeletePhoto = (photoId) => {
        if (!diaryModalDateKey) return;
        updateDayLog(
          (prev) => ({
            ...prev,
            photos: (prev.photos || []).filter((p) => p.id !== photoId)
          }),
          diaryModalDateKey
        );
      };

      const handleAddVideoLink = (e) => {
        e.preventDefault();
        if (!diaryModalDateKey) return;
        const parsed = parseVideoEmbedUrl(videoUrlInput);
        if (!parsed) {
          setVideoErrorMsg('YouTube 링크(watch/shorts/youtu.be) 또는 Google Drive 파일 공유 링크만 지원됩니다.');
          return;
        }
        const newVid = {
          id: 'vid_' + Date.now(),
          title: videoTitleInput.trim() || `${parsed.platform} 영상`,
          url: parsed.originalUrl,
          embedUrl: parsed.embedUrl,
          platform: parsed.platform
        };
        updateDayLog(
          (prev) => ({
            ...prev,
            videos: [...(prev.videos || []), newVid]
          }),
          diaryModalDateKey
        );
        setVideoTitleInput('');
        setVideoUrlInput('');
        setVideoErrorMsg('');
      };

      const handleDeleteVideo = (videoId) => {
        if (!diaryModalDateKey) return;
        updateDayLog(
          (prev) => ({
            ...prev,
            videos: (prev.videos || []).filter((v) => v.id !== videoId)
          }),
          diaryModalDateKey
        );
      };

      // 일 / 주 / 월 목표 제어 함수
      const activeGoalBucketKey = useMemo(() => {
        if (goalPeriod === 'daily') return selectedDateKey;
        if (goalPeriod === 'weekly') return getWeekKey(selectedDateKey);
        return getMonthKey(selectedDateKey);
      }, [goalPeriod, selectedDateKey]);

      const activeGoalLabel = useMemo(() => {
        if (goalPeriod === 'daily') return `${selectedDateKey} 일 목표`;
        if (goalPeriod === 'weekly') return `${activeGoalBucketKey} 주간 목표`;
        return `${activeGoalBucketKey} 월간 목표`;
      }, [goalPeriod, selectedDateKey, activeGoalBucketKey]);

      const currentGoalList = useMemo(() => {
        return (goals[goalPeriod]?.[activeGoalBucketKey]) || [];
      }, [goals, goalPeriod, activeGoalBucketKey]);

      const saveGoalsBucket = (nextBucketList) => {
        setGoals((prev) => {
          const nextGoals = {
            ...prev,
            [goalPeriod]: {
              ...(prev[goalPeriod] || {}),
              [activeGoalBucketKey]: nextBucketList
            }
          };
          localStorage.setItem(STORAGE_GOALS_KEY, JSON.stringify(nextGoals));
          if (db) {
            setSyncStatus('saving');
            db.ref(`${DB_ROOT_PATH}/goals/${goalPeriod}/${activeGoalBucketKey}`)
              .set(nextBucketList)
              .then(() => setSyncStatus('synced'))
              .catch(() => setSyncStatus('error'));
          }
          return nextGoals;
        });
      };

      const handleAddGoal = (e) => {
        e.preventDefault();
        if (!goalInput.trim()) return;
        saveGoalsBucket([...currentGoalList, { id: 'g_' + Date.now(), text: goalInput.trim(), done: false }]);
        setGoalInput('');
      };

      const handleToggleGoal = (id) => {
        saveGoalsBucket(currentGoalList.map((g) => (g.id === id ? { ...g, done: !g.done } : g)));
      };

      const handleDeleteGoal = (id) => {
        saveGoalsBucket(currentGoalList.filter((g) => g.id !== id));
      };

      const handleSaveGoalEdit = (id) => {
        if (!editingGoalText.trim()) return;
        saveGoalsBucket(
          currentGoalList.map((g) => (g.id === id ? { ...g, text: editingGoalText.trim() } : g))
        );
        setEditingGoalId(null);
        setEditingGoalText('');
      };

      // 전체 기록 검색 엔진
      const searchResults = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q && searchFilter === 'all') return [];

        const sortedDates = Object.keys(logs).sort((a, b) => b.localeCompare(a));
        const results = [];

        sortedDates.forEach((dateKey) => {
          const l = { ...getEmptyDayLog(), ...(logs[dateKey] || {}) };
          const matches = [];

          if (searchFilter === 'all' || searchFilter === 'workout') {
            const matchedTags = (l.workoutTags || []).filter((t) => t.toLowerCase().includes(q));
            if (matchedTags.length > 0 && q) {
              matches.push({ type: 'workout', label: `운동 태그: ${matchedTags.join(', ')}` });
            }
            const matchedChecks = (l.workoutChecks || []).filter((c) => c.toLowerCase().includes(q));
            if (matchedChecks.length > 0 && q) {
              matches.push({ type: 'workout', label: `보강 루틴: ${matchedChecks.join(', ')}` });
            }
            config.workoutMetrics.forEach((m) => {
              const val = l.workoutMetrics?.[m.id];
              if (val && q && m.label.toLowerCase().includes(q)) {
                matches.push({ type: 'workout', label: `${m.label}: ${val}${m.unit}` });
              }
            });
            if (searchFilter === 'workout' && !q && (l.workoutTags.length > 0 || l.workoutChecks.length > 0)) {
              matches.push({
                type: 'workout',
                label: [...l.workoutTags, ...l.workoutChecks].slice(0, 3).join(' · ')
              });
            }
          }

          if (searchFilter === 'all' || searchFilter === 'expense') {
            (l.expenses || []).forEach((ex) => {
              const textHit =
                !q ||
                (ex.title && ex.title.toLowerCase().includes(q)) ||
                (ex.category && ex.category.toLowerCase().includes(q)) ||
                (ex.payment && ex.payment.toLowerCase().includes(q));
              if (textHit && (q || searchFilter === 'expense')) {
                matches.push({
                  type: 'expense',
                  label: `[${ex.category}] ${ex.title} — ${Number(ex.amount).toLocaleString()}원 (${ex.payment})`
                });
              }
            });
          }

          if (searchFilter === 'all' || searchFilter === 'condition') {
            const sickHit = q && ('아팠'.includes(q) || '병가'.includes(q) || '몸살'.includes(q)) && l.isSick;
            if (sickHit || (searchFilter === 'condition' && !q && l.isSick)) {
              matches.push({ type: 'condition', label: '🤒 아팠던 날 표시됨' });
            }
            const matchedSyms = (l.symptoms || []).filter((s) => !q || s.toLowerCase().includes(q));
            if (matchedSyms.length > 0 && (q || searchFilter === 'condition')) {
              matches.push({ type: 'condition', label: `증상: ${matchedSyms.join(', ')}` });
            }
            Object.entries(l.painLevels || {}).forEach(([part, lv]) => {
              if (Number(lv) > 0 && (!q || part.toLowerCase().includes(q))) {
                matches.push({ type: 'condition', label: `${part}: Lv.${lv}` });
              }
            });
          }

          if (searchFilter === 'all' || searchFilter === 'habit') {
            const matchedHabits = config.habits.filter(
              (h) => l.habitsDone?.includes(h.id) && (!q || h.label.toLowerCase().includes(q))
            );
            if (matchedHabits.length > 0 && (q || searchFilter === 'habit')) {
              matches.push({ type: 'habit', label: `루틴: ${matchedHabits.map((h) => h.label).join(', ')}` });
            }
          }

          if (searchFilter === 'all' && q) {
            if (l.dailyNote && l.dailyNote.toLowerCase().includes(q)) {
              matches.push({ type: 'note', label: `메모: "${l.dailyNote}"` });
            }
            if (
              (l.diaryTitle && l.diaryTitle.toLowerCase().includes(q)) ||
              (l.diaryBody && l.diaryBody.toLowerCase().includes(q))
            ) {
              matches.push({ type: 'diary', label: `일기: ${l.diaryTitle || l.diaryBody.slice(0, 40)}` });
            }
          }

          if (matches.length > 0) {
            results.push({ dateKey, matches });
          }
        });

        return results;
      }, [logs, searchQuery, searchFilter, config]);

      const jumpToSearchDate = (dateKey, matchType) => {
        setMainSection('calendar');
        setSelectedDateKey(dateKey);
        setCurrentDate(new Date(dateKey + 'T00:00:00'));
        if (matchType === 'diary') {
          setDiaryModalDateKey(dateKey);
        } else if (['workout', 'habit', 'condition', 'expense'].includes(matchType)) {
          setActiveTab(matchType);
        }
        setIsSearchOpen(false);
      };

      // 월간 / 주간 날짜 계산
      const calendarDays = useMemo(() => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startOffset = firstDay.getDay();
        const totalDays = lastDay.getDate();

        const days = [];
        for (let i = startOffset - 1; i >= 0; i--) {
          const d = new Date(year, month, -i);
          days.push({ date: d, key: formatDateKey(d), isCurrentMonth: false });
        }
        for (let i = 1; i <= totalDays; i++) {
          const d = new Date(year, month, i);
          days.push({ date: d, key: formatDateKey(d), isCurrentMonth: true });
        }
        const remaining = (7 - (days.length % 7)) % 7;
        for (let i = 1; i <= remaining; i++) {
          const d = new Date(year, month + 1, i);
          days.push({ date: d, key: formatDateKey(d), isCurrentMonth: false });
        }
        return days;
      }, [currentDate]);

      const weekDays = useMemo(() => {
        const base = new Date(selectedDateKey + 'T00:00:00');
        const dayOfWeek = base.getDay();
        const sunday = new Date(base);
        sunday.setDate(base.getDate() - dayOfWeek);

        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          return { date: d, key: formatDateKey(d) };
        });
      }, [selectedDateKey]);

      const handlePrev = () => {
        if (viewMode === 'month') {
          setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
        } else {
          const d = new Date(selectedDateKey + 'T00:00:00');
          d.setDate(d.getDate() - 7);
          setSelectedDateKey(formatDateKey(d));
          setCurrentDate(d);
        }
      };

      const handleNext = () => {
        if (viewMode === 'month') {
          setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
        } else {
          const d = new Date(selectedDateKey + 'T00:00:00');
          d.setDate(d.getDate() + 7);
          setSelectedDateKey(formatDateKey(d));
          setCurrentDate(d);
        }
      };

      const handleGoToday = () => {
        const now = new Date();
        setCurrentDate(now);
        setSelectedDateKey(formatDateKey(now));
      };

      const summaryStats = useMemo(() => {
        const targetKeys = viewMode === 'month'
          ? calendarDays.filter((d) => d.isCurrentMonth).map((d) => d.key)
          : weekDays.map((d) => d.key);

        let workoutDays = 0;
        let sickDays = 0;
        let totalExpense = 0;
        let lumpSumExpense = 0;
        let installmentExpense = 0;

        targetKeys.forEach((k) => {
          const l = logs[k];
          if (!l) return;
          const hasWorkout =
            (l.workoutTags && l.workoutTags.length > 0) ||
            (l.workoutChecks && l.workoutChecks.length > 0) ||
            Object.values(l.workoutMetrics || {}).some((v) => Number(v) > 0);
          if (hasWorkout) workoutDays++;
          if (l.isSick) sickDays++;

          (l.expenses || []).forEach((exp) => {
            const amt = Number(exp.amount) || 0;
            totalExpense += amt;
            if (exp.payment && exp.payment.includes('할부')) {
              installmentExpense += amt;
            } else {
              lumpSumExpense += amt;
            }
          });
        });

        return { workoutDays, sickDays, totalExpense, lumpSumExpense, installmentExpense };
      }, [logs, viewMode, calendarDays, weekDays]);

      // 근무표 요약 집계 (주간/월간)
      const shiftStats = useMemo(() => {
        const targetKeys = shiftViewMode === 'month'
          ? calendarDays.filter((d) => d.isCurrentMonth).map((d) => d.key)
          : weekDays.map((d) => d.key);

        let workDays = 0;
        let offDays = 0;
        let totalHours = 0;
        let totalOvertime = 0;

        targetKeys.forEach((k) => {
          const s = shifts[k];
          if (!s) return;
          if (s.label === '휴무' || s.typeId === 'st_off') {
            offDays++;
          } else {
            workDays++;
            totalHours += calcShiftHours(s.startTime, s.endTime);
            totalOvertime += Number(s.overtimeHours || 0);
          }
        });

        return {
          workDays,
          offDays,
          totalHours: Number(totalHours.toFixed(1)),
          totalOvertime: Number(totalOvertime.toFixed(1))
        };
      }, [shifts, shiftViewMode, calendarDays, weekDays]);

      const handleExportData = () => {
        const dataStr = JSON.stringify({ config, logs, goals, shifts }, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `life-calendar-backup-${formatDateKey(new Date())}.json`;
        a.click();
      };

      const handleImportData = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed.config) saveConfig(parsed.config);
            if (parsed.logs) {
              setLogs(parsed.logs);
              localStorage.setItem(STORAGE_LOGS_KEY, JSON.stringify(parsed.logs));
              if (db) db.ref(`${DB_ROOT_PATH}/logs`).set(parsed.logs);
            }
            if (parsed.goals) {
              setGoals(parsed.goals);
              localStorage.setItem(STORAGE_GOALS_KEY, JSON.stringify(parsed.goals));
              if (db) db.ref(`${DB_ROOT_PATH}/goals`).set(parsed.goals);
            }
            if (parsed.shifts) {
              setShifts(parsed.shifts);
              localStorage.setItem(STORAGE_SHIFTS_KEY, JSON.stringify(parsed.shifts));
              if (db) db.ref(`${DB_ROOT_PATH}/shifts`).set(parsed.shifts);
            }
            alert('백업 데이터를 불러오고 동기화했습니다!');
          } catch (err) {
            alert('올바른 백업 파일이 아닙니다.');
          }
        };
        reader.readAsText(file);
      };

      const handleSaveExpense = (e) => {
        e.preventDefault();
        if (!expTitle.trim() || !expAmount) return;

        updateDayLog((prev) => {
          const list = [...(prev.expenses || [])];
          if (editingExpenseId) {
            const idx = list.findIndex((item) => item.id === editingExpenseId);
            if (idx > -1) {
              list[idx] = {
                ...list[idx],
                category: expCategory,
                payment: expPayment,
                title: expTitle.trim(),
                amount: Number(expAmount)
              };
            }
          } else {
            list.push({
              id: 'exp_' + Date.now(),
              category: expCategory,
              payment: expPayment,
              title: expTitle.trim(),
              amount: Number(expAmount)
            });
          }
          return { ...prev, expenses: list };
        });

        setExpTitle('');
        setExpAmount('');
        setEditingExpenseId(null);
      };

      const korWeekNames = ['일', '월', '화', '수', '목', '금', '토'];

      const renderSyncBadge = () => {
        if (syncStatus === 'synced') {
          return <span className="text-[11px] bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full">🟢 실시간 동기화</span>;
        }
        if (syncStatus === 'saving' || syncStatus === 'connecting') {
          return <span className="text-[11px] bg-sky-500/15 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-full">🔄 동기화 중...</span>;
        }
        if (syncStatus === 'error') {
          return <span className="text-[11px] bg-rose-500/15 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded-full">⚠️ DB 연결 확인</span>;
        }
        return <span className="text-[11px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">⚪ 로컬 저장 모드</span>;
      };

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 pb-14">
          {/* 상단 헤더 */}
          <header className="sticky top-0 z-30 bg-[#090d16]/95 backdrop-blur border-b border-slate-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3 flex-wrap">
                <div className="flex items-center gap-2">
                  <span className="text-xl">📅</span>
                  {isEditingTitle ? (
                    <input
                      type="text"
                      value={config.appTitle}
                      onChange={(e) => saveConfig({ ...config, appTitle: e.target.value })}
                      onBlur={() => setIsEditingTitle(false)}
                      onKeyDown={(e) => e.key === 'Enter' && setIsEditingTitle(false)}
                      autoFocus
                      className="bg-slate-800 text-white font-bold text-lg px-2 py-0.5 rounded border border-indigo-500 outline-none"
                    />
                  ) : (
                    <h1
                      onClick={() => setIsEditingTitle(true)}
                      title="클릭하여 제목 변경"
                      className="text-lg sm:text-xl font-extrabold tracking-tight cursor-pointer hover:text-indigo-400 transition"
                    >
                      {config.appTitle}
                    </h1>
                  )}
                </div>

                {/* 메인 섹션 분리 탭: 캘린더 vs 근무표 */}
                <div className="inline-flex rounded-xl bg-slate-900 p-1 border border-slate-700">
                  <button
                    onClick={() => setMainSection('calendar')}
                    className={`px-3 py-1 text-xs sm:text-sm font-extrabold rounded-lg transition ${
                      mainSection === 'calendar'
                        ? 'bg-indigo-600 text-white shadow'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    📅 캘린더
                  </button>
                  <button
                    onClick={() => setMainSection('shift')}
                    className={`px-3 py-1 text-xs sm:text-sm font-extrabold rounded-lg transition ${
                      mainSection === 'shift'
                        ? 'bg-teal-600 text-white shadow'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    🗓️ 근무표
                  </button>
                </div>

                {renderSyncBadge()}
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                <button
                  onClick={() => setIsSearchOpen(true)}
                  className="px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/50 text-indigo-300 transition"
                >
                  🔍 기록 검색
                </button>

                {mainSection === 'calendar' && (
                  <div className="inline-flex rounded-lg bg-slate-900 p-1 border border-slate-800">
                    <button
                      onClick={() => setViewMode('month')}
                      className={`px-3 py-1 text-xs sm:text-sm font-semibold rounded-md transition ${
                        viewMode === 'month' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      월간
                    </button>
                    <button
                      onClick={() => setViewMode('week')}
                      className={`px-3 py-1 text-xs sm:text-sm font-semibold rounded-md transition ${
                        viewMode === 'week' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      주간
                    </button>
                  </div>
                )}

                <button
                  onClick={() => setIsEditConfigMode(!isEditConfigMode)}
                  className={`px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg border transition ${
                    isEditConfigMode
                      ? 'bg-amber-500/20 border-amber-500 text-amber-300'
                      : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                  }`}
                >
                  ⚙️ {isEditConfigMode ? '편집 완료' : '항목 자유 편집'}
                </button>

                <button
                  onClick={handleExportData}
                  title="백업 저장"
                  className="px-2.5 py-1.5 text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-slate-300"
                >
                  💾 백업
                </button>
                <label
                  title="백업 불러오기"
                  className="px-2.5 py-1.5 text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-slate-300 cursor-pointer"
                >
                  📂 복원
                  <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                </label>
              </div>
            </div>
          </header>

          {/* 전체 일기장 모달 */}
          {diaryModalDateKey && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="px-4 py-3.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2.5">
                    <span className="text-xl">📖</span>
                    <div>
                      <div className="text-[11px] text-indigo-400 font-bold">상세 일기 & 미디어 기록</div>
                      <h2 className="text-base sm:text-lg font-extrabold">{diaryModalDateKey} 일기</h2>
                    </div>
                  </div>
                  <button
                    onClick={() => setDiaryModalDateKey(null)}
                    className="px-3 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-200"
                  >
                    닫기 ✕
                  </button>
                </div>

                <div className="p-4 sm:p-5 overflow-y-auto space-y-5 flex-1">
                  <div className="space-y-2.5">
                    <input
                      type="text"
                      value={activeDiaryLog.diaryTitle || ''}
                      onChange={(e) => updateDayLog({ diaryTitle: e.target.value }, diaryModalDateKey)}
                      placeholder="오늘 일기 제목"
                      className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-sm sm:text-base font-bold outline-none"
                    />
                    <textarea
                      rows="7"
                      value={activeDiaryLog.diaryBody || ''}
                      onChange={(e) => updateDayLog({ diaryBody: e.target.value }, diaryModalDateKey)}
                      placeholder="오늘 하루 있었던 일, 감상, 연습 기록, 컨디션 등을 자유롭게 길게 적어보세요..."
                      className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl p-3.5 text-sm leading-relaxed text-slate-100 outline-none resize-y"
                    />
                  </div>

                  {/* 사진 첨부 */}
                  <div className="pt-4 border-t border-slate-800 space-y-3">
                    <div className="flex items-center justify-between gap-2">
                      <div>
                        <div className="text-sm font-extrabold text-slate-100">📷 사진 첨부</div>
                        <div className="text-[11px] text-slate-400">
                          선택 시 자동으로 용량 압축 후 저장됩니다 {isCompressingPhoto ? '(압축 중...)' : ''}
                        </div>
                      </div>
                      <label className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg cursor-pointer transition">
                        + 사진 추가
                        <input
                          type="file"
                          accept="image/*"
                          multiple
                          onChange={handlePhotoUpload}
                          className="hidden"
                        />
                      </label>
                    </div>

                    {(activeDiaryLog.photos || []).length === 0 ? (
                      <div className="text-center py-6 text-xs text-slate-500 bg-slate-950/60 border border-dashed border-slate-800 rounded-xl">
                        첨부된 사진이 없습니다.
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        {(activeDiaryLog.photos || []).map((ph) => (
                          <div
                            key={ph.id}
                            className="group relative bg-slate-950 border border-slate-800 rounded-xl overflow-hidden"
                          >
                            <img
                              src={ph.dataUrl}
                              alt={ph.caption || '첨부 사진'}
                              onClick={() => setLightboxPhoto(ph)}
                              className="w-full h-36 object-cover cursor-pointer hover:opacity-90 transition"
                            />
                            <button
                              onClick={() => handleDeletePhoto(ph.id)}
                              title="사진 삭제"
                              className="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-black/70 hover:bg-rose-600 text-white text-xs font-bold flex items-center justify-center"
                            >
                              ✕
                            </button>
                            {ph.caption && (
                              <div className="px-2 py-1 text-[11px] text-slate-400 truncate bg-slate-950/90">
                                {ph.caption}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* 동영상 임베드 */}
                  <div className="pt-4 border-t border-slate-800 space-y-3">
                    <div>
                      <div className="text-sm font-extrabold text-slate-100">🎬 동영상 연결 (YouTube / Google Drive)</div>
                      <div className="text-[11px] text-slate-400">
                        YouTube 또는 Google Drive 공유 링크를 넣으면 일기장 안에서 바로 재생됩니다.
                      </div>
                    </div>

                    <form onSubmit={handleAddVideoLink} className="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input
                          type="text"
                          value={videoTitleInput}
                          onChange={(e) => setVideoTitleInput(e.target.value)}
                          placeholder="영상 제목"

                        onChange={(e) => setNewShiftTypeLabel(e.target.value)}
                        placeholder="유형명 (예: 오전반, 반차)"
                        className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs outline-none"
                      />
                      <input
                        type="time"
                        value={newShiftStart}
                        onChange={(e) => setNewShiftStart(e.target.value)}
                        className="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs"
                      />
                      <input
                        type="time"
                        value={newShiftEnd}
                        onChange={(e) => setNewShiftEnd(e.target.value)}
                        className="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs"
                      />
                    </div>
                    <button
                      onClick={() => {
                        if (!newShiftTypeLabel.trim()) return;
                        saveConfig({
                          ...config,
                          shiftTypes: [
                            ...(config.shiftTypes || []),
                            {
                              id: 'st_' + Date.now(),
                              label: newShiftTypeLabel.trim(),
                              defaultStart: newShiftStart,
                              defaultEnd: newShiftEnd
                            }
                          ]
                        });
                        setNewShiftTypeLabel('');
                      }}
                      className="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg"
                    >
                      근무 유형 저장
                    </button>
                  </div>
                </div>
              </section>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
