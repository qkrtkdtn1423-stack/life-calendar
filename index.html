<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>라이프 캘린더</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase Compat SDK (단일 HTML용) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // 0. Firebase 설정 (여기에 본인의 Realtime Database URL 입력)
    // ==========================================
    const FIREBASE_CONFIG = {
      databaseURL: "https://calander-b4df0-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
      // 예시: "https://meraki-vocal-default-rtdb.asia-southeast1.firebasedatabase.app"

    let db = null;
    const isFirebaseConfigured =
      FIREBASE_CONFIG.databaseURL &&
      FIREBASE_CONFIG.databaseURL.startsWith("https://");

    if (isFirebaseConfigured && window.firebase) {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        db = firebase.database();
      } catch (e) {
        console.error("Firebase 초기화 오류:", e);
      }
    }

    // ==========================================
    // 1. 기본 프리셋 설정 (웹 앱 안에서 100% 추가/수정/삭제 가능)
    // ==========================================
    const DEFAULT_CONFIG = {
      appTitle: '라이프 캘린더',
      workoutTags: [
        '더클라임 사당', '더클라임 구로', '더클라임 연남', '더클라임 강남',
        '홈트/방음부스', '야외 러닝', 'Giant SCR 자출',
        '오버행', '슬랩', '토훅', '다이나믹/포고', '고관절 가동성'
      ],
      workoutMetrics: [
        { id: 'm_navy', label: '남색 완등', unit: '문제' },
        { id: 'm_purple', label: '보라 완등', unit: '문제' },
        { id: 'm_pink', label: '핑크 완등', unit: '문제' },
        { id: 'm_pullup', label: '중량 풀업 최고무게', unit: 'kg' },
        { id: 'm_run', label: 'Zone 2 러닝 거리', unit: 'km' }
      ],
      workoutChecklists: [
        '비스트메이커 1000 (14/18/25mm 인터벌)',
        '왼손 11kg 핀치 등척성 홀드',
        '턱 플란체 & 플란체 린',
        '슈도 푸쉬업 (10회 세트)',
        'WTYT 어깨 안정화 & 전거근 프로트랙션',
        '코호흡 Zone 2 러닝 (5\'58"~6\'15" 페이스)'
      ],
      habits: [
        { id: 'h_vocal', icon: '🎤', label: '방음부스 보컬 연습 (복압/목열기/텅트릴/믹스)' },
        { id: 'h_jp', icon: '🇯🇵', label: '일본어 공부 (JLPT N2 문법/한자/가사)' },
        { id: 'h_foam', icon: '🧘', label: 'EPP 폼롤러 광배근/어깨 근막이완' },
        { id: 'h_read', icon: '📚', label: '독서 / 밀리의서재 / 웹툰·라노벨' },
        { id: 'h_vocal_app', icon: '💻', label: '보컬 노트 스튜디오 곡/가사 마크업 정리' }
      ],
      conditionSymptoms: [
        '감기/몸살 기운', '인후통/목 잠김', '수면 부족/피로', '두통', '소화불량', '근육통 심함'
      ],
      bodyParts: [
        '손가락 A2 풀리/관절', '왼쪽 팔꿈치/전완근', '오른쪽 팔꿈치/전완근',
        '어깨/회전근개', '허리/코어', '무릎/발목'
      ],
      expenseCategories: [
        '식비/카페', '클라이밍/운동', '음악/장비/악보', '아반떼 CN7/교통', '구독/게임', '생활/기타'
      ],
      paymentMethods: [
        '카드 일시불', '카드 할부(실적제외)', '체크/계좌이체'
      ]
    };

    const STORAGE_CONFIG_KEY = 'LIFE_CALENDAR_CUSTOM_CONFIG_V2';
    const STORAGE_LOGS_KEY = 'LIFE_CALENDAR_DAILY_LOGS_V2';
    const DB_ROOT_PATH = 'lifeCalendar';

    const formatDateKey = (dateObj) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const getEmptyDayLog = () => ({
      workoutTags: [],
      workoutMetrics: {},
      workoutChecks: [],
      workoutMemo: '',
      habitsDone: [],
      isSick: false,
      symptoms: [],
      painLevels: {},
      conditionMemo: '',
      expenses: [],
      dailyNote: ''
    });

    function App() {
      // 동기화 상태 ('local' | 'connecting' | 'synced' | 'saving' | 'error')
      const [syncStatus, setSyncStatus] = useState(db ? 'connecting' : 'local');
      const isRemoteUpdateRef = useRef(false);

      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_CONFIG_KEY);
          return saved ? { ...DEFAULT_CONFIG, ...JSON.parse(saved) } : DEFAULT_CONFIG;
        } catch (e) {
          return DEFAULT_CONFIG;
        }
      });

      const [logs, setLogs] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_LOGS_KEY);
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      // ==========================================
      // Firebase 실시간 리스너 연결
      // ==========================================
      useEffect(() => {
        if (!db) return;

        const configRef = db.ref(`${DB_ROOT_PATH}/config`);
        const logsRef = db.ref(`${DB_ROOT_PATH}/logs`);

        const onConfigValue = (snapshot) => {
          const val = snapshot.val();
          if (val) {
            isRemoteUpdateRef.current = true;
            const merged = { ...DEFAULT_CONFIG, ...val };
            setConfig(merged);
            localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(merged));
          } else {
            // Firebase가 비어있으면 현재 로컬 설정을 초기 업로드
            configRef.set(config);
          }
          setSyncStatus('synced');
        };

        const onLogsValue = (snapshot) => {
          const val = snapshot.val();
          if (val) {
            isRemoteUpdateRef.current = true;
            setLogs(val);
            localStorage.setItem(STORAGE_LOGS_KEY, JSON.stringify(val));
          } else if (Object.keys(logs).length > 0) {
            logsRef.set(logs);
          }
          setSyncStatus('synced');
        };

        configRef.on('value', onConfigValue, () => setSyncStatus('error'));
        logsRef.on('value', onLogsValue, () => setSyncStatus('error'));

        return () => {
          configRef.off('value', onConfigValue);
          logsRef.off('value', onLogsValue);
        };
      }, []);

      // 설정 변경 시 로컬 + Firebase 저장
      const saveConfig = (newConfig) => {
        setConfig(newConfig);
        localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(newConfig));
        if (db) {
          setSyncStatus('saving');
          db.ref(`${DB_ROOT_PATH}/config`)
            .set(newConfig)
            .then(() => setSyncStatus('synced'))
            .catch(() => setSyncStatus('error'));
        }
      };

      // 특정 날짜 기록 변경 시 로컬 + Firebase 해당 날짜 노드만 효율적으로 업데이트
      const updateDayLog = (updater) => {
        setLogs((prev) => {
          const existing = { ...getEmptyDayLog(), ...(prev[selectedDateKey] || {}) };
          const updated = typeof updater === 'function' ? updater(existing) : { ...existing, ...updater };
          const nextLogs = { ...prev, [selectedDateKey]: updated };
          localStorage.setItem(STORAGE_LOGS_KEY, JSON.stringify(nextLogs));

          if (db) {
            setSyncStatus('saving');
            db.ref(`${DB_ROOT_PATH}/logs/${selectedDateKey}`)
              .set(updated)
              .then(() => setSyncStatus('synced'))
              .catch(() => setSyncStatus('error'));
          }
          return nextLogs;
        });
      };

      // 2. 캘린더 네비게이션 및 뷰 상태
      const [viewMode, setViewMode] = useState('month');
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDateKey, setSelectedDateKey] = useState(formatDateKey(new Date()));
      const [activeTab, setActiveTab] = useState('workout');
      const [isEditConfigMode, setIsEditConfigMode] = useState(false);
      const [isEditingTitle, setIsEditingTitle] = useState(false);

      // 새 항목 추가용 입력 상태
      const [newTagInput, setNewTagInput] = useState('');
      const [newMetricLabel, setNewMetricLabel] = useState('');
      const [newMetricUnit, setNewMetricUnit] = useState('회');
      const [newCheckInput, setNewCheckInput] = useState('');
      const [newHabitIcon, setNewHabitIcon] = useState('🔥');
      const [newHabitLabel, setNewHabitLabel] = useState('');
      const [newSymptomInput, setNewSymptomInput] = useState('');
      const [newBodyPartInput, setNewBodyPartInput] = useState('');
      const [newCategoryInput, setNewCategoryInput] = useState('');
      const [newPaymentInput, setNewPaymentInput] = useState('');

      // 가계부 지출 입력 상태
      const [expCategory, setExpCategory] = useState(config.expenseCategories[0] || '식비/카페');
      const [expPayment, setExpPayment] = useState(config.paymentMethods[0] || '카드 일시불');
      const [expTitle, setExpTitle] = useState('');
      const [expAmount, setExpAmount] = useState('');
      const [editingExpenseId, setEditingExpenseId] = useState(null);

      const currentDayLog = useMemo(() => {
        return { ...getEmptyDayLog(), ...(logs[selectedDateKey] || {}) };
      }, [logs, selectedDateKey]);

      // 월간 / 주간 날짜 배열 계산
      const calendarDays = useMemo(() => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startOffset = firstDay.getDay();
        const totalDays = lastDay.getDate();

        const days = [];
        for (let i = startOffset - 1; i >= 0; i--) {
          const d = new Date(year, month, -i);
          days.push({ date: d, key: formatDateKey(d), isCurrentMonth: false });
        }
        for (let i = 1; i <= totalDays; i++) {
          const d = new Date(year, month, i);
          days.push({ date: d, key: formatDateKey(d), isCurrentMonth: true });
        }
        const remaining = (7 - (days.length % 7)) % 7;
        for (let i = 1; i <= remaining; i++) {
          const d = new Date(year, month + 1, i);
          days.push({ date: d, key: formatDateKey(d), isCurrentMonth: false });
        }
        return days;
      }, [currentDate]);

      const weekDays = useMemo(() => {
        const base = new Date(selectedDateKey + 'T00:00:00');
        const dayOfWeek = base.getDay();
        const sunday = new Date(base);
        sunday.setDate(base.getDate() - dayOfWeek);

        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          return { date: d, key: formatDateKey(d) };
        });
      }, [selectedDateKey]);

      const handlePrev = () => {
        if (viewMode === 'month') {
          setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
        } else {
          const d = new Date(selectedDateKey + 'T00:00:00');
          d.setDate(d.getDate() - 7);
          setSelectedDateKey(formatDateKey(d));
          setCurrentDate(d);
        }
      };

      const handleNext = () => {
        if (viewMode === 'month') {
          setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
        } else {
          const d = new Date(selectedDateKey + 'T00:00:00');
          d.setDate(d.getDate() + 7);
          setSelectedDateKey(formatDateKey(d));
          setCurrentDate(d);
        }
      };

      const handleGoToday = () => {
        const now = new Date();
        setCurrentDate(now);
        setSelectedDateKey(formatDateKey(now));
      };

      const summaryStats = useMemo(() => {
        const targetKeys = viewMode === 'month'
          ? calendarDays.filter((d) => d.isCurrentMonth).map((d) => d.key)
          : weekDays.map((d) => d.key);

        let workoutDays = 0;
        let sickDays = 0;
        let totalExpense = 0;
        let lumpSumExpense = 0;
        let installmentExpense = 0;

        targetKeys.forEach((k) => {
          const l = logs[k];
          if (!l) return;
          const hasWorkout =
            (l.workoutTags && l.workoutTags.length > 0) ||
            (l.workoutChecks && l.workoutChecks.length > 0) ||
            Object.values(l.workoutMetrics || {}).some((v) => Number(v) > 0);
          if (hasWorkout) workoutDays++;
          if (l.isSick) sickDays++;

          (l.expenses || []).forEach((exp) => {
            const amt = Number(exp.amount) || 0;
            totalExpense += amt;
            if (exp.payment && exp.payment.includes('할부')) {
              installmentExpense += amt;
            } else {
              lumpSumExpense += amt;
            }
          });
        });

        return { workoutDays, sickDays, totalExpense, lumpSumExpense, installmentExpense };
      }, [logs, viewMode, calendarDays, weekDays]);

      const handleExportData = () => {
        const dataStr = JSON.stringify({ config, logs }, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `life-calendar-backup-${formatDateKey(new Date())}.json`;
        a.click();
      };

      const handleImportData = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed.config) saveConfig(parsed.config);
            if (parsed.logs) {
              setLogs(parsed.logs);
              localStorage.setItem(STORAGE_LOGS_KEY, JSON.stringify(parsed.logs));
              if (db) db.ref(`${DB_ROOT_PATH}/logs`).set(parsed.logs);
            }
            alert('백업 데이터를 불러오고 클라우드에 동기화했습니다!');
          } catch (err) {
            alert('올바른 백업 파일이 아닙니다.');
          }
        };
        reader.readAsText(file);
      };

      const handleSaveExpense = (e) => {
        e.preventDefault();
        if (!expTitle.trim() || !expAmount) return;

        updateDayLog((prev) => {
          const list = [...(prev.expenses || [])];
          if (editingExpenseId) {
            const idx = list.findIndex((item) => item.id === editingExpenseId);
            if (idx > -1) {
              list[idx] = {
                ...list[idx],
                category: expCategory,
                payment: expPayment,
                title: expTitle.trim(),
                amount: Number(expAmount)
              };
            }
          } else {
            list.push({
              id: 'exp_' + Date.now(),
              category: expCategory,
              payment: expPayment,
              title: expTitle.trim(),
              amount: Number(expAmount)
            });
          }
          return { ...prev, expenses: list };
        });

        setExpTitle('');
        setExpAmount('');
        setEditingExpenseId(null);
      };

      const korWeekNames = ['일', '월', '화', '수', '목', '금', '토'];

      const renderSyncBadge = () => {
        if (syncStatus === 'synced') {
          return <span className="text-[11px] bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full">🟢 실시간 동기화</span>;
        }
        if (syncStatus === 'saving' || syncStatus === 'connecting') {
          return <span className="text-[11px] bg-sky-500/15 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-full">🔄 동기화 중...</span>;
        }
        if (syncStatus === 'error') {
          return <span className="text-[11px] bg-rose-500/15 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded-full">⚠️ DB 연결 확인</span>;
        }
        return <span className="text-[11px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">⚪ 로컬 저장 모드</span>;
      };

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 pb-12">
          {/* 상단 헤더 */}
          <header className="sticky top-0 z-30 bg-[#090d16]/95 backdrop-blur border-b border-slate-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <span className="text-xl">📅</span>
                {isEditingTitle ? (
                  <input
                    type="text"
                    value={config.appTitle}
                    onChange={(e) => saveConfig({ ...config, appTitle: e.target.value })}
                    onBlur={() => setIsEditingTitle(false)}
                    onKeyDown={(e) => e.key === 'Enter' && setIsEditingTitle(false)}
                    autoFocus
                    className="bg-slate-800 text-white font-bold text-lg px-2 py-0.5 rounded border border-indigo-500 outline-none"
                  />
                ) : (
                  <h1
                    onClick={() => setIsEditingTitle(true)}
                    title="클릭하여 제목 변경"
                    className="text-lg sm:text-xl font-extrabold tracking-tight cursor-pointer hover:text-indigo-400 transition"
                  >
                    {config.appTitle}
                  </h1>
                )}
                {renderSyncBadge()}
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                <div className="inline-flex rounded-lg bg-slate-900 p-1 border border-slate-800">
                  <button
                    onClick={() => setViewMode('month')}
                    className={`px-3 py-1 text-xs sm:text-sm font-semibold rounded-md transition ${
                      viewMode === 'month' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    월간
                  </button>
                  <button
                    onClick={() => setViewMode('week')}
                    className={`px-3 py-1 text-xs sm:text-sm font-semibold rounded-md transition ${
                      viewMode === 'week' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    주간
                  </button>
                </div>

                <button
                  onClick={() => setIsEditConfigMode(!isEditConfigMode)}
                  className={`px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg border transition ${
                    isEditConfigMode
                      ? 'bg-amber-500/20 border-amber-500 text-amber-300'
                      : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                  }`}
                >
                  ⚙️ {isEditConfigMode ? '편집 완료' : '항목 자유 편집'}
                </button>

                <button
                  onClick={handleExportData}
                  title="백업 저장"
                  className="px-2.5 py-1.5 text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-slate-300"
                >
                  💾 백업
                </button>
                <label
                  title="백업 불러오기"
                  className="px-2.5 py-1.5 text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-slate-300 cursor-pointer"
                >
                  📂 복원
                  <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                </label>
              </div>
            </div>
          </header>

          {/* 메인 레이아웃 */}
          <main className="max-w-7xl mx-auto px-3 sm:px-4 pt-4 grid grid-cols-1 lg:grid-cols-12 gap-5">
            {/* 좌측 7컬럼: 캘린더 */}
            <section className="lg:col-span-7 flex flex-col gap-4">
              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handlePrev}
                      className="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200"
                    >
                      ◀
                    </button>
                    <h2 className="text-base sm:text-lg font-bold min-w-[130px] text-center">
                      {viewMode === 'month'
                        ? `${currentDate.getFullYear()}년 ${currentDate.getMonth() + 1}월`
                        : `${weekDays[0].key.slice(5)} ~ ${weekDays[6].key.slice(5)}`}
                    </h2>
                    <button

                                  type="text"
                                  value={h.label}
                                  onChange={(e) => {
                                    const updated = config.habits.map((item) =>
                                      item.id === h.id ? { ...item, label: e.target.value } : item
                                    );
                                    saveConfig({ ...config, habits: updated });
                                  }}
                                  className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs w-full"
                                />
                              ) : (
                                <span className="text-xs sm:text-sm font-semibold">{h.label}</span>
                              )}
                            </div>
                            {isEditConfigMode ? (
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  saveConfig({
                                    ...config,
                                    habits: config.habits.filter((item) => item.id !== h.id)
                                  });
                                }}
                                className="text-rose-400 text-xs font-bold px-2"
                              >
                                ✕
                              </button>
                            ) : (
                              <span className="text-xs font-bold">{done ? '완료 ✓' : '미완료'}</span>
                            )}
                          </div>
                        );
                      })}
                    </div>

                    <div className="flex gap-1.5 pt-2">
                      <input
                        type="text"
                        value={newHabitIcon}
                        onChange={(e) => setNewHabitIcon(e.target.value)}
                        className="w-12 text-center bg-slate-950 border border-slate-800 rounded-lg py-1.5 text-sm"
                        placeholder="🔥"
                      />
                      <input
                        type="text"
                        value={newHabitLabel}
                        onChange={(e) => setNewHabitLabel(e.target.value)}
                        placeholder="+ 새로운 습관/루틴 이름 입력"
                        className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs outline-none"
                      />
                      <button
                        onClick={() => {
                          if (!newHabitLabel.trim()) return;
                          saveConfig({
                            ...config,
                            habits: [
                              ...config.habits,
                              {
                                id: 'h_' + Date.now(),
                                icon: newHabitIcon || '✨',
                                label: newHabitLabel.trim()
                              }
                            ]
                          });
                          setNewHabitLabel('');
                        }}
                        className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg"
                      >
                        추가
                      </button>
                    </div>
                  </div>
                )}

                {/* 탭 3: 컨디션 */}
                {activeTab === 'condition' && (
                  <div className="space-y-4 max-h-[65vh] overflow-y-auto pr-1">
                    <div className="flex items-center justify-between bg-rose-950/30 border border-rose-500/40 rounded-xl p-3">
                      <div>
                        <div className="text-sm font-bold text-rose-300">🤒 오늘 아팠던 날로 표시</div>
                        <div className="text-[11px] text-rose-300/70">달력에 🤒 아이콘과 함께 통계에 집계됩니다</div>
                      </div>
                      <input
                        type="checkbox"
                        checked={currentDayLog.isSick}
                        onChange={(e) => updateDayLog({ isSick: e.target.checked })}
                        className="w-5 h-5 accent-rose-500 cursor-pointer"
                      />
                    </div>

                    <div>
                      <div className="text-xs font-bold text-slate-400 mb-2">증상 / 컨디션 태그</div>
                      <div className="flex flex-wrap gap-1.5">
                        {config.conditionSymptoms.map((sym) => {
                          const active = currentDayLog.symptoms.includes(sym);
                          return (
                            <div key={sym} className="inline-flex items-center">
                              <button
                                onClick={() =>
                                  updateDayLog((prev) => ({
                                    ...prev,
                                    symptoms: active
                                      ? prev.symptoms.filter((s) => s !== sym)
                                      : [...prev.symptoms, sym]
                                  }))
                                }
                                className={`px-2.5 py-1 text-xs font-semibold rounded-lg border transition ${
                                  active
                                    ? 'bg-rose-600 border-rose-500 text-white'
                                    : 'bg-slate-950 border-slate-800 text-slate-300'
                                }`}
                              >
                                {sym}
                              </button>
                              {isEditConfigMode && (
                                <button
                                  onClick={() =>
                                    saveConfig({
                                      ...config,
                                      conditionSymptoms: config.conditionSymptoms.filter((s) => s !== sym)
                                    })
                                  }
                                  className="ml-1 text-rose-400 text-xs font-bold"
                                >
                                  ✕
                                </button>
                              )}
                            </div>
                          );
                        })}
                      </div>
                      <div className="flex gap-1.5 mt-2">
                        <input
                          type="text"
                          value={newSymptomInput}
                          onChange={(e) => setNewSymptomInput(e.target.value)}
                          placeholder="+ 새 증상 태그 추가"
                          className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs outline-none"
                        />
                        <button
                          onClick={() => {
                            if (!newSymptomInput.trim()) return;
                            saveConfig({
                              ...config,
                              conditionSymptoms: [...config.conditionSymptoms, newSymptomInput.trim()]
                            });
                            setNewSymptomInput('');
                          }}
                          className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg"
                        >
                          추가
                        </button>
                      </div>
                    </div>

                    <div className="pt-3 border-t border-slate-800">
                      <div className="text-xs font-bold text-slate-400 mb-2">부위별 통증 / 뻐근함 강도 (0: 정상 ~ 5: 심함)</div>
                      <div className="space-y-2">
                        {config.bodyParts.map((part) => {
                          const lv = Number(currentDayLog.painLevels?.[part] || 0);
                          return (
                            <div
                              key={part}
                              className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 flex flex-col gap-1.5"
                            >
                              <div className="flex items-center justify-between">
                                <span className="text-xs font-semibold">{part}</span>
                                {isEditConfigMode && (
                                  <button
                                    onClick={() =>
                                      saveConfig({
                                        ...config,
                                        bodyParts: config.bodyParts.filter((p) => p !== part)
                                      })
                                    }
                                    className="text-rose-400 text-xs font-bold"
                                  >
                                    삭제 ✕
                                  </button>
                                )}
                              </div>
                              <div className="grid grid-cols-6 gap-1">
                                {[0, 1, 2, 3, 4, 5].map((num) => (
                                  <button
                                    key={num}
                                    onClick={() =>
                                      updateDayLog((prev) => ({
                                        ...prev,
                                        painLevels: { ...prev.painLevels, [part]: num }
                                      }))
                                    }
                                    className={`py-1 rounded text-xs font-bold transition ${
                                      lv === num
                                        ? num === 0
                                          ? 'bg-emerald-600 text-white'
                                          : num <= 2
                                          ? 'bg-amber-500 text-black'
                                          : 'bg-rose-600 text-white'
                                        : 'bg-slate-900 text-slate-400 hover:bg-slate-800'
                                    }`}
                                  >
                                    {num === 0 ? '정상' : `Lv.${num}`}
                                  </button>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                      <div className="flex gap-1.5 mt-2">
                        <input
                          type="text"
                          value={newBodyPartInput}
                          onChange={(e) => setNewBodyPartInput(e.target.value)}
                          placeholder="+ 관리할 신체 부위 추가"
                          className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs outline-none"
                        />
                        <button
                          onClick={() => {
                            if (!newBodyPartInput.trim()) return;
                            saveConfig({
                              ...config,
                              bodyParts: [...config.bodyParts, newBodyPartInput.trim()]
                            });
                            setNewBodyPartInput('');
                          }}
                          className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg"
                        >
                          추가
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* 탭 4: 소비 */}
                {activeTab === 'expense' && (
                  <div className="space-y-4 max-h-[65vh] overflow-y-auto pr-1">
                    <form onSubmit={handleSaveExpense} className="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2.5">
                      <div className="text-xs font-bold text-slate-400">
                        {editingExpenseId ? '✏️ 지출 내역 수정' : '+ 새 지출 기록 추가'}
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <select
                          value={expCategory}
                          onChange={(e) => setExpCategory(e.target.value)}
                          className="bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-xs outline-none"
                        >
                          {config.expenseCategories.map((c) => (
                            <option key={c} value={c}>{c}</option>
                          ))}
                        </select>
                        <select
                          value={expPayment}
                          onChange={(e) => setExpPayment(e.target.value)}
                          className="bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-xs outline-none"
                        >
                          {config.paymentMethods.map((p) => (
                            <option key={p} value={p}>{p}</option>
                          ))}
                        </select>
                      </div>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={expTitle}
                          onChange={(e) => setExpTitle(e.target.value)}
                          placeholder="내역 (예: 더클라임 일일권, 주유)"
                          className="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs outline-none"
                        />
                        <input
                          type="number"
                          value={expAmount}
                          onChange={(e) => setExpAmount(e.target.value)}
                          placeholder="금액(원)"
                          className="w-28 bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs outline-none"
                        />
                      </div>
                      <div className="flex gap-2">
                        <button
                          type="submit"
                          className="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-lg"
                        >
                          {editingExpenseId ? '수정 완료' : '지출 추가'}
                        </button>
                        {editingExpenseId && (
                          <button
                            type="button"
                            onClick={() => {
                              setEditingExpenseId(null);
                              setExpTitle('');
                              setExpAmount('');
                            }}
                            className="px-3 py-2 bg-slate-800 text-xs rounded-lg"
                          >
                            취소
                          </button>
                        )}
                      </div>
                    </form>

                    <div className="space-y-1.5">
                      {(currentDayLog.expenses || []).length === 0 ? (
                        <div className="text-center py-4 text-xs text-slate-500">기록된 지출이 없습니다.</div>
                      ) : (
                        currentDayLog.expenses.map((item) => (
                          <div
                            key={item.id}
                            className="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs"
                          >
                            <div>
                              <div className="flex items-center gap-1.5">
                                <span className="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded text-[10px]">
                                  {item.category}
                                </span>
                                <span
                                  className={`px-1.5 py-0.5 rounded text-[10px] ${
                                    item.payment?.includes('할부')
                                      ? 'bg-amber-500/20 text-amber-300'
                                      : 'bg-sky-500/20 text-sky-300'
                                  }`}
                                >
                                  {item.payment}
                                </span>
                              </div>
                              <div className="font-bold text-slate-200 mt-1">{item.title}</div>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className="font-extrabold text-amber-400">
                                {Number(item.amount).toLocaleString()}원
                              </span>
                              <button
                                onClick={() => {
                                  setEditingExpenseId(item.id);
                                  setExpCategory(item.category);
                                  setExpPayment(item.payment);
                                  setExpTitle(item.title);
                                  setExpAmount(item.amount);
                                }}
                                className="text-slate-400 hover:text-indigo-400"
                              >
                                수정
                              </button>
                              <button
                                onClick={() =>
                                  updateDayLog((prev) => ({
                                    ...prev,
                                    expenses: prev.expenses.filter((e) => e.id !== item.id)
                                  }))
                                }
                                className="text-rose-400 hover:text-rose-300"
                              >
                                삭제
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    {isEditConfigMode && (
                      <div className="pt-3 border-t border-slate-800 space-y-3">
                        <div>
                          <div className="text-xs font-bold text-amber-300 mb-1.5">소비 카테고리 편집</div>
                          <div className="flex flex-wrap gap-1 mb-2">
                            {config.expenseCategories.map((c) => (
                              <span key={c} className="bg-slate-800 text-xs px-2 py-1 rounded flex items-center gap-1">
                                {c}
                                <button
                                  onClick={() =>
                                    saveConfig({
                                      ...config,
                                      expenseCategories: config.expenseCategories.filter((x) => x !== c)
                                    })
                                  }
                                  className="text-rose-400 font-bold"
                                >
                                  ✕
                                </button>
                              </span>
                            ))}
                          </div>
                          <div className="flex gap-1.5">
                            <input
                              type="text"
                              value={newCategoryInput}
                              onChange={(e) => setNewCategoryInput(e.target.value)}
                              placeholder="+ 새 소비 카테고리"
                              className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs"
                            />
                            <button
                              onClick={() => {
                                if (!newCategoryInput.trim()) return;
                                saveConfig({
                                  ...config,
                                  expenseCategories: [...config.expenseCategories, newCategoryInput.trim()]
                                });
                                setNewCategoryInput('');
                              }}
                              className="px-2.5 py-1 bg-slate-800 text-xs font-bold rounded-lg"
                            >
                              추가
                            </button>
                          </div>
                        </div>

                        <div>
                          <div className="text-xs font-bold text-amber-300 mb-1.5">결제수단 편집</div>
                          <div className="flex flex-wrap gap-1 mb-2">
                            {config.paymentMethods.map((p) => (
                              <span key={p} className="bg-slate-800 text-xs px-2 py-1 rounded flex items-center gap-1">
                                {p}
                                <button
                                  onClick={() =>
                                    saveConfig({
                                      ...config,
                                      paymentMethods: config.paymentMethods.filter((x) => x !== p)
                                    })
                                  }
                                  className="text-rose-400 font-bold"
                                >
                                  ✕
                                </button>
                              </span>
                            ))}
                          </div>
                          <div className="flex gap-1.5">
                            <input
                              type="text"
                              value={newPaymentInput}
                              onChange={(e) => setNewPaymentInput(e.target.value)}
                              placeholder="+ 새 결제수단"
                              className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs"
                            />
                            <button
                              onClick={() => {
                                if (!newPaymentInput.trim()) return;
                                saveConfig({
                                  ...config,
                                  paymentMethods: [...config.paymentMethods, newPaymentInput.trim()]
                                });
                                setNewPaymentInput('');
                              }}
                              className="px-2.5 py-1 bg-slate-800 text-xs font-bold rounded-lg"
                            >
                              추가
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* 공통 메모 */}
                <div className="mt-4 pt-3 border-t border-slate-800">
                  <div className="text-xs font-bold text-slate-400 mb-1.5">📝 오늘의 자유 메모</div>
                  <textarea
                    rows="2"
                    value={currentDayLog.dailyNote}
                    onChange={(e) => updateDayLog({ dailyNote: e.target.value })}
                    placeholder="오늘의 운동 감각, 노래 연습 피드백, 특이사항 등을 자유롭게 남겨보세요."
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 outline-none focus:border-indigo-500 resize-none"
                  />
                </div>
              </div>
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
